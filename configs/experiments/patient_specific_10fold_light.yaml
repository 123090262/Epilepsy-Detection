# Paper-comparable patient-specific random-window CV.
# Do not interpret these results as cross-patient or unseen-seizure generalization.
data:
  source: raw_edf
  data_dir: CHBMIT
  sample_rate: 256
  segment_duration: 1.0
  seizure_overlap: 0.5
  non_seizure_ratio_min: 2.0
  non_seizure_ratio_max: 3.0
  num_channels: 18
  filter_low_hz: 0.5
  filter_high_hz: 50.0
  filter_order: 4
  filter_context_seconds: 4.0
  raw_cache_segments: 32768
  sampling_seed: 42
  use_jne_selected_durations: true
  test_patients:
    - chb01

train:
  batch_size: 512
  num_epochs: 60
  learning_rate: 0.0005
  weight_decay: 0.0001
  val_size: 0.15
  random_state: 42
  num_workers: 0
  clip_lower_quantile: 0.001
  clip_upper_quantile: 0.999
  statistics_max_segments: 4096
  optimizer: adamw
  scheduler: cosine
  loss: cross_entropy
  focal_gamma: 2.0
  focal_alpha: 0.65
  sampling_strategy: all
  negative_ratio: 1.5
  max_grad_norm: 1.0
  early_stopping_patience: 8
  threshold_metric: accuracy
  checkpoint_metric: accuracy
  min_threshold: 0.15
  max_threshold: 0.85

model:
  architecture: light_seizure_net
  feature_dim: 64
  hidden_dim: 64
  num_classes: 2
  dropout: 0.20
  graph_dropout: 0.0
  spectral_fusion: false
  auxiliary_weight: 0.0

output:
  run_dir: runs
  checkpoint_dir: checkpoints
