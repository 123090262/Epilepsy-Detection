data:
  source: pool
  data_dir: data/chbmit_pool_1to10_22ch
  sample_rate: 256
  segment_duration: 2.0
  num_channels: 22
  test_patients:
    - chb06
    - chb08
    - chb10

train:
  batch_size: 32
  num_epochs: 60
  learning_rate: 0.0005
  weight_decay: 0.000001
  val_size: 0.1
  random_state: 42
  num_workers: 0
  clip_lower_quantile: 0.001
  clip_upper_quantile: 0.999
  statistics_max_segments: 4096
  sampling_strategy: balanced

model:
  feature_dim: 128
  hidden_dim: 256
  num_classes: 2

output:
  run_dir: runs
  checkpoint_dir: checkpoints
