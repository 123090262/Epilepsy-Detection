data:
  data_dir: data/chbmit_pool_1to10_22ch
  sample_rate: 256
  segment_duration: 2.0
  num_channels: 22
  test_patients:
    - chb01
    - chb02
    - chb03
    - chb04
    - chb05
    - chb06
    - chb07
    - chb08
    - chb09
    - chb10
    - chb11
    - chb12
    - chb13
    - chb14
    - chb15
    - chb16
    - chb17
    - chb18
    - chb19
    - chb20
    - chb21
    - chb22
    - chb23
    - chb24
    



train:
  batch_size: 32
  num_epochs: 60
  learning_rate: 0.001
  weight_decay: 0.000001
  val_size: 0.1
  random_state: 42
  num_workers: 0
  clip_lower_quantile: 0.001
  clip_upper_quantile: 0.999
  statistics_max_segments: 4096
  optimizer: adamw
  scheduler: onecycle
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.65
  negative_ratio: 3.0
  max_grad_norm: 1.0
  early_stopping_patience: 10
  threshold_metric: composite
  checkpoint_metric: composite
  min_threshold: 0.05
  max_threshold: 0.95

model:
  feature_dim: 128
  hidden_dim: 128
  num_classes: 2
  dropout: 0.40
  graph_dropout: 0.25
  spectral_fusion: true
  auxiliary_weight: 0.25

output:
  run_dir: runs
  checkpoint_dir: checkpoints
